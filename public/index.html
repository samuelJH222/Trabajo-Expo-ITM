<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Hábitos sanos y cotidianos</title>
</head>
<body>
    <header class="encabezado">
        <div class="inicio">
            <h1 class="titulo">Hábitos sanos y cotidianos</h1>
        </div>
    </header>

    <main class="cuerpo">
        <div class="formulario">
            <h2>Bienvenido</h2>

            <form class="ingreso" id="formIngreso">
                <label for="nombre">Nombre completo:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    maxlength="100"
                    autocomplete="name"
                    required
                >

                <label for="email">Correo electrónico:</label>
                <input
                    type="email"
                    id="email"
                    name="correo"
                    maxlength="254"
                    autocomplete="email"
                    required
                >

                <button class="boton" type="submit">
                    Continuar
                </button>

                <p id="mensaje" role="status" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <footer class="pie-de-pagina"></footer>

    <script src="app.js"></script>
</body>
</html>
